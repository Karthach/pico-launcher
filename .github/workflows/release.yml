name: Build Pico Launcher release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:dev-latest
    name: Build Pico Launcher
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install zip
        run:
          apt-get update && apt-get -y install zip
      - name: Setup Compatibility Layer for libtwl
        run: |
          # Create a fake devkitARM directory structure with the rules libtwl expects
          mkdir -p /tmp/fake-devkitarm
          cat <<'EOF' > /tmp/fake-devkitarm/ds_rules
          PREFIX  := /opt/wonderful/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-
          CC      := $(PREFIX)gcc
          CXX     := $(PREFIX)g++
          AR      := $(PREFIX)gcc-ar
          AS      := $(PREFIX)gcc
          OBJCOPY := $(PREFIX)objcopy

          # Explicit rules for libtwl objects to ensure they use the correct tools
          %.o: %.c
          	@echo "  CC $<"
          	@$(CC) $(CFLAGS) -MMD -MP -c -o $@ $<

          %.o: %.cpp
          	@echo "  CXX $<"
          	@$(CXX) $(CXXFLAGS) -MMD -MP -c -o $@ $<

          %.o: %.s
          	@echo "  AS $<"
          	@$(CC) -x assembler-with-cpp $(ASFLAGS) -MMD -MP -c -o $@ $<

          $(OUTPUT): $(OFILES)
          	@echo "  AR $@"
          	@$(AR) rcs $@ $(OFILES)
          EOF

          # Inject variables into the environment for subsequent steps
          echo "DEVKITARM=/tmp/fake-devkitarm" >> $GITHUB_ENV
          echo "CPATH=/opt/wonderful/thirdparty/blocksds/core/libs/libnds/include" >> $GITHUB_ENV
          echo "CPLUS_INCLUDE_PATH=/opt/wonderful/thirdparty/blocksds/core/libs/libnds/include" >> $GITHUB_ENV
          echo "ASFLAGS=-I/opt/wonderful/thirdparty/blocksds/core/libs/libnds/include" >> $GITHUB_ENV
      - name: Run build script
        run: |
          make -j$(nproc 2>/dev/null || echo 2) DEVKITARM=/tmp/fake-devkitarm
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            LAUNCHER.nds
          name: Pico_Launcher
      - name: Package for release
        run: |
          mkdir Pico_Launcher
          cp -r _pico/ LAUNCHER.nds Pico_Launcher
          cd Pico_Launcher && zip -r $PWD.zip *
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pico_Launcher.zip
