name: Build Pico Launcher

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["develop"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pico_launcher:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    name: Build Pico Launcher
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run build script
        run: |
          make
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: |
            _pico/
            LAUNCHER.nds
          name: Pico_Launcher
      - name: Create Release Package
        run: |
          # Install zip in container if not present
          apt-get update && apt-get install -y zip
          mkdir -p latest_build
          cp LAUNCHER.nds latest_build/
          cp -r _pico latest_build/
          zip -r Pico_Launcher_Latest.zip latest_build/*
      - name: Point test tag at working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/latest';
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha
              });
            }
      - name: Update Latest Development Build test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Pico Launcher Test Build (working)"
          body: |
            English: Rolling test build from the `working` branch. Use it to test upcoming changes; it is not a stable release.

            Español: Compilación de pruebas actualizada desde la rama `working`. Úsala para probar los próximos cambios; no es una versión estable.
          prerelease: true
          make_latest: false
          files: |
            LAUNCHER.nds
            Pico_Launcher_Latest.zip
